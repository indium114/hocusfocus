[package]
name = "hocusfocus"
description = "A terminal-based productivity tracker"
license = "MIT"
version = "2.2.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = [ "serde" ] }
comfy-table = "8.0.0"
demand = "2.0.2"
dirs = "6.0.0"
humantime = "2.3.0"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
